baseURL = 'https://pitrian.be/'
canonifyURLs = true
languageCode = 'nl'
title = 'Pitrian'
defaultContentLanguage = 'nl'

[languages]
  [languages.en]
    languageName = 'English'
    weight = 2
    contentDir = 'content/en'
    [languages.en.params]
      description = 'I build software'

    [[languages.en.menu.main]]
      identifier = 'about'
      name = 'About'
      url = '/about/'
      weight = 2
    
    [[languages.en.menu.main]]
      identifier = 'technology'
      name = 'Technology'
      url = '/technology/'
      weight = 3
    
    [[languages.en.menu.main]]
      identifier = 'work'
      name = 'Work'
      url = '/work/'
      weight = 4

    [[languages.en.menu.main]]
      identifier = 'contact'
      name = 'Contact'
      url = '/contact/'
      weight = 5
  
  [languages.nl]
    languageName = 'Nederlands'
    weight = 1
    contentDir = 'content/nl'
    [languages.nl.params]
      description = 'Ik bouw software'

    [[languages.nl.menu.main]]
      identifier = 'about'
      name = 'Over'
      url = '/about/'
      weight = 2
    
    [[languages.nl.menu.main]]
      identifier = 'technology'
      name = 'Technologie'
      url = '/technology/'
      weight = 3
    
    [[languages.nl.menu.main]]
      identifier = 'work'
      name = 'Werk'
      url = '/work/'
      weight = 4

    [[languages.nl.menu.main]]
      identifier = 'contact'
      name = 'Contact'
      url = '/contact/'
      weight = 5

[params]
  author = 'Pitrian'

[outputs]
  home = ['HTML', 'sitemap']
  page = ['HTML']

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
