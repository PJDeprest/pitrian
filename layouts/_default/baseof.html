<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ block "title" . }}{{ .Site.Title }}{{ end }}</title>
  <meta name="description" content="{{ .Site.Params.description }}">
  {{ $style := resources.Get "scss/main.scss" | resources.ToCSS | resources.Minify }}
  <link rel="stylesheet" href="{{ $style.Permalink }}">
</head>
<body>
  {{ partial "header.html" . }}
  
  <main>
    {{ block "main" . }}{{ end }}
  </main>
  
  {{ partial "footer.html" . }}
  
  <script>
    // Theme toggle - minimal JS
    const toggle = document.getElementById('theme-toggle');
    const html = document.documentElement;
    const stored = localStorage.getItem('theme');

    // Function to update the icon based on current theme
    function updateThemeIcon() {
      const current = html.getAttribute('data-theme');
      const icon = toggle.querySelector('.theme-icon');
      if (current === 'dark') {
        // Dark mode active, show light icon (where you'll go)
        icon.textContent = '◐';
        toggle.setAttribute('data-theme-target', 'light');
      } else {
        // Light mode active, show dark icon (where you'll go)
        icon.textContent = '◑';
        toggle.setAttribute('data-theme-target', 'dark');
      }
    }

    if (stored) {
      html.setAttribute('data-theme', stored);
    } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
      html.setAttribute('data-theme', 'dark');
    }

    if (toggle) {
      // Update icon on page load
      updateThemeIcon();

      toggle.addEventListener('click', () => {
        const current = html.getAttribute('data-theme');
        const next = current === 'dark' ? 'light' : 'dark';
        html.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
        // Update icon after switching
        updateThemeIcon();
      });
    }
  </script>
</body>
</html>
